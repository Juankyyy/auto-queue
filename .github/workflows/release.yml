name: Release EXE

# Acepta tags estilo "0.1.0" (el usado hasta ahora) y "v0.1.0".
on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout (historial completo para el changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm scripts/LoLAutoQueue.spec

      - name: Check output
        shell: pwsh
        run: |
          Get-ChildItem dist/
          if (!(Test-Path "dist/LoLAutoQueue.exe")) { throw "No se generó dist/LoLAutoQueue.exe" }

      - name: Generar notas de la release
        shell: pwsh
        run: ./.github/scripts/release-notes.ps1 -Tag "${{ github.ref_name }}"

      - name: Create GitHub Release with EXE
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoLAutoQueue.exe
          name: LoL Auto Queue ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

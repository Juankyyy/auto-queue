name: Auto Release (bump + tag + EXE)

# Saca una release completa en 1 clic:
# Actions > Auto Release > Run workflow > eliges patch/minor/major y las novedades.
# Hace bump de version.txt, crea el tag, compila el .exe y publica
# la release con changelog automático. Todo dentro de esta misma
# ejecución (los tags creados con GITHUB_TOKEN no disparan otros
# workflows, por eso el build vive aquí y no en "Release EXE").
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de subida de versión"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      notes:
        description: "Novedades (aparecen arriba de la lista de cambios)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.next }}
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular siguiente versión
        id: ver
        shell: bash
        run: |
          cur=$(tr -d ' \t\r\n' < version.txt)
          major=$(echo "$cur" | cut -d. -f1)
          minor=$(echo "$cur" | cut -d. -f2)
          patch=$(echo "$cur" | cut -d. -f3)
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "current=$cur" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Versión: $cur -> $next"

      - name: Actualizar version.txt y pushear
        shell: bash
        run: |
          echo "${{ steps.ver.outputs.next }}" > version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "release: ${{ steps.ver.outputs.next }}"
          git push

      - name: Crear y pushear tag
        shell: bash
        run: |
          next="${{ steps.ver.outputs.next }}"
          if [ -n "${{ inputs.notes }}" ]; then
            git tag -a "$next" -m "${{ inputs.notes }}"
          else
            git tag "$next"
          fi
          git push origin "$next"

  build-and-publish:
    needs: bump-and-tag
    runs-on: windows-latest
    steps:
      - name: Checkout del tag recién creado
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm LoLAutoQueue.spec

      - name: Check output
        shell: pwsh
        run: |
          Get-ChildItem dist/
          if (!(Test-Path "dist/LoLAutoQueue.exe")) { throw "No se generó dist/LoLAutoQueue.exe" }

      - name: Generar notas de la release
        shell: pwsh
        run: |
          $tag = "${{ needs.bump-and-tag.outputs.tag }}"
          $tagMsg = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
          $prev = (git describe --tags --abbrev=0 "$tag^" 2>$null | Out-String).Trim()
          if ($prev) { $range = "$prev..$tag" } else { $range = $tag }
          # Commits del rango: sin merges y sin los bumps automáticos de version.txt
          $lines = @(git log $range --no-merges --invert-grep --grep="^release: " --pretty=format:'%H%x01%s' --reverse)
          # Clasificación por Conventional Commits (feat: -> Novedades, fix: -> Bugs)
          $feats = @(); $fixes = @(); $others = @()
          foreach ($l in $lines) {
            $p = $l -split "`x01", 2
            if ($p.Count -lt 2) { continue }
            $h = $p[0].Substring(0, 7)
            $s = $p[1].Trim()
            if ($s -match '^feat(\([^)]*\))?!?:\s*(.+)$') { $feats += "- $($Matches[2].Trim()) ($h)" }
            elseif ($s -match '^fix(\([^)]*\))?!?:\s*(.+)$') { $fixes += "- $($Matches[2].Trim()) ($h)" }
            else { $others += "- $s ($h)" }
          }
          $body = ""
          if ($tagMsg) { $body += "$tagMsg`r`n`r`n" }
          if ($feats.Count -gt 0) { $body += "## Novedades`r`n`r`n" + ($feats -join "`r`n") + "`r`n`r`n" }
          if ($fixes.Count -gt 0) { $body += "## Bugs`r`n`r`n" + ($fixes -join "`r`n") + "`r`n`r`n" }
          if ($others.Count -gt 0) { $body += "## Otros cambios`r`n`r`n" + ($others -join "`r`n") + "`r`n`r`n" }
          if (-not $body) { $body = "_Sin cambios destacables en esta versión._" }
          Set-Content -Path RELEASE_NOTES.md -Value $body -Encoding UTF8
          Get-Content RELEASE_NOTES.md

      - name: Create GitHub Release with EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-and-tag.outputs.tag }}
          files: dist/LoLAutoQueue.exe
          name: ${{ needs.bump-and-tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
